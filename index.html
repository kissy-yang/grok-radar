<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f6f1">
  <title>Grok Radar</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./mascot.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 6h5l4 6h5M5 18h5l4-6M3 6h2m-2 12h2m14-6h2"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="18" r="1"/><circle cx="21" cy="12" r="1"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0 .1 4M20 4v6h-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.3 15.3 4.2 4.2"/></symbol>
    <symbol id="i-hook" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="17" r="2.4"/><circle cx="19" cy="17" r="2.4"/><path d="m10.8 7-4.3 7.8m11 0L13.2 7M7.4 17h9.2"/></symbol>
    <symbol id="i-deploy" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 9 8-4.5M12 12 4 7.5M12 12v9"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-2-13-4 16"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-searchfile" viewBox="0 0 24 24"><path d="M12 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8l4 4v3"/><circle cx="15.5" cy="15.5" r="3.2"/><path d="m18 18 2.5 2.5M13 3v5h5"/></symbol>
    <symbol id="i-fix" viewBox="0 0 24 24"><path d="M14 7a4 4 0 0 1 5-4l-3 3 2 2 3-3a4 4 0 0 1-5 5l-7 8a2 2 0 1 1-3-3l8-7Z"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><path d="M7 5H5v15h14V5h-2M9 3h6v4H9Zm-1 11 2 2 5-5"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m5 15-1 5 5-1L20 8l-4-4L5 15Zm9-9 4 4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s7-3.5 7-10V5l-7-3-7 3v7c0 6.5 7 10 7 10Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M4 20V10m5 10V4m5 16v-6m5 6V7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M8 11h8"/></symbol>
  </svg>

  <header class="header">
    <div class="header-inner">
      <span class="view-tab board-name"><svg aria-hidden="true"><use href="#i-logo"></use></svg><span data-en="Workbench">事件工作台</span></span>
      <div class="header-actions">
        <div class="toolbar-utilities" role="group" aria-label="工作台工具" data-en-aria-label="Workbench tools">
          <button id="sync-refresh" class="button" type="button" title="重新读取 Grok Bot 的本机数据" data-en-title="Refresh data from Grok Bot" hidden><svg aria-hidden="true"><use href="#i-refresh"></use></svg><span data-en="Refresh">刷新</span></button>
          <button id="routing-bindings-open" class="button" type="button" data-en="Role bindings" disabled>角色绑定</button>
          <button id="import-open" class="button" type="button"><svg aria-hidden="true"><use href="#i-upload"></use></svg><span data-en="Import records">导入记录</span></button>
        </div>
        <button id="route-add" class="button button-primary" type="button" data-en="Add event" disabled>加入事件</button>
        <div id="language-control" class="segmented language-control" role="group" aria-label="Language / 语言">
          <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
          <button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="true">简体中文</button>
        </div>
      </div>
    </div>
  </header>
  <main id="top" class="page">
    <p id="live-announcement" class="sr-only" role="status"></p>
    <p id="sync-feedback" class="workbench-notice" role="status" aria-atomic="true" hidden>
      <strong id="sync-run-result"></strong>
      <small id="sync-data-result"></small>
    </p>
    <section class="board-heading" aria-labelledby="overview-heading">
      <div class="intro">
        <div class="board-brand">
          <span class="board-emblem" id="board-emblem"></span>
          <div class="board-title">
            <h1 id="overview-heading">Grok Radar</h1>
            <div class="summary-actions">
              <span id="dataset" class="dataset" role="status"><span class="dataset-dot"></span><span id="dataset-label" data-en="Checking connection">正在核对连接</span></span>
              <p id="overview-copy"></p><span id="board-timeline" class="board-timeline" aria-hidden="true"></span>
            </div>
          </div>
        </div>
        <section id="weekly-quota" class="weekly-quota" aria-labelledby="weekly-quota-label" hidden>
          <header class="quota-heading">
            <h2 id="weekly-quota-label" data-en="Weekly quota">本周额度</h2>
            <button type="button" id="official-usage" class="quota-link"><span data-en="Official usage">官方用量</span><svg aria-hidden="true"><use href="#i-chevron"></use></svg></button>
          </header>
          <div class="quota-body" id="weekly-quota-body" hidden>
            <div id="weekly-quota-meter" class="quota-gauge" role="meter" aria-valuemin="0" aria-valuemax="100"
                 aria-label="本周剩余额度" data-en-aria-label="Remaining weekly quota">
              <span class="quota-arc" aria-hidden="true"></span>
              <span class="quota-marker" id="weekly-quota-marker" aria-hidden="true" hidden></span>
              <span class="quota-gauge-label" aria-hidden="true"><strong><span id="weekly-quota-value"></span><small>%</small></strong>
                <span data-en="Remaining">剩余</span>
                <small class="quota-countdown" id="weekly-quota-countdown" hidden></small>
              </span>
            </div>
            <dl class="quota-details">
              <div><dt data-en="Pace" title="按本周截至上次更新的平均用量与均匀预算比较" data-en-title="Compares average use so far this week with an even weekly budget">配速</dt>
                <dd><span class="quota-pace-badge" id="weekly-quota-pace-badge" hidden></span><strong id="weekly-quota-pace">—</strong></dd></div>
              <div><dt data-en="Reset">重置</dt><dd id="weekly-quota-reset">—</dd></div>
              <div><dt data-en="Estimate" title="按 7 天周期内的平均用量估算，手动重置或用量变化会影响结果" data-en-title="Based on average use over the current 7-day period. Manual resets or changes in usage can affect the estimate.">预计</dt><dd id="weekly-quota-forecast">—</dd></div>
            </dl>
          </div>
          <p id="weekly-quota-empty" class="quota-empty" data-en="Waiting for quota data from Grok Bot.">等待 Grok Bot 同步额度。</p>
          <small id="weekly-quota-time" class="quota-updated" hidden></small>
          <small id="official-usage-error" role="status" hidden></small>
        </section>
      </div>
      <section id="metrics" class="metrics" aria-label="运行指标" data-en-aria-label="Activity metrics"></section>
    </section>
    <p id="workbench-notice" class="workbench-notice" role="status" hidden></p>
    <div class="overview-grid">
      <section class="panel route-panel" aria-labelledby="flow-title">
        <div class="panel-heading"><div><h2 id="flow-title" data-en="Event flow">事件路由</h2><p id="flow-subtitle" data-en="From event sources to specialist bots">从触发源到专项 Bot</p></div><div class="flow-heading-actions"><button class="button" id="run-access" type="button" title="读取 Grok Bot 侧栏的运行状态" data-en-title="Read live status from the Grok Bot sidebar" data-en="Connect live status" hidden>连接实时状态</button><span id="flow-rate" class="pill"></span></div></div>
        <p id="run-access-note" class="workbench-notice run-access-note" role="status" hidden></p>
        <div id="flow"></div>
      </section>
      <section class="panel usage-panel" aria-labelledby="usage-title">
        <div class="panel-heading"><div><h2 id="usage-title" data-en="Cost trends">费用趋势</h2><p id="cost-caption"></p></div><span id="cost-unit" class="pill unit">USD</span></div>
        <div id="tempo" class="tempo" hidden>
          <canvas id="tempo-chart" role="img" aria-label="事件分布" data-en-aria-label="Event distribution"></canvas>
          <span id="tempo-range" class="sr-only"></span>
        </div>
        <dl id="sync-details" class="sync-details" hidden></dl>
        <div id="usage-summary" class="usage-summary"></div>
        <div id="chart-wrap"><canvas id="chart" role="img" aria-label="累计费用折线图" data-en-aria-label="Cumulative cost chart"></canvas></div>
        <div id="chart-legend" class="chart-legend"></div>
      </section>
    </div>
    <section id="activity" class="panel activity" aria-labelledby="activity-title">
      <div class="panel-heading activity-heading">
        <div><h2 id="activity-title"><span data-en="Event log">事件日志</span> <span id="results-count" class="counter"></span></h2><p id="activity-caption" data-en="Workbench, synced Grok Bot, and imported records">工作台记录、Grok Bot 同步和导入数据</p></div>
        <div class="table-actions">
          <div class="segmented" id="periods" role="group" aria-label="统计时间范围" data-en-aria-label="Date range">
            <button type="button" data-range="0" aria-pressed="true" data-en="All time">全部</button>
            <button type="button" data-range="1" aria-pressed="false" data-en="Last 24h">近 24h</button>
            <button type="button" data-range="7" aria-pressed="false" data-en="Last 7 days">近 7 天</button>
          </div>
          <label class="search"><svg aria-hidden="true"><use href="#i-search"></use></svg><input id="search" type="search" placeholder="搜索事件、Bot 或 ID" data-en-placeholder="Search events, bots, or IDs" aria-label="搜索事件、Bot 或 ID" data-en-aria-label="Search events, bots, or IDs"></label>
          <label class="select" id="status-filter">
            <select id="status" aria-label="按状态筛选" data-en-aria-label="Filter by status">
              <option value="" data-en="All statuses">全部状态</option>
              <option value="draft" data-en="Pending handoff">待交接</option>
              <option value="awaiting" data-en="Awaiting confirmation">待镜像确认</option>
              <option value="confirmed" data-en="Confirmed">已确认</option>
              <option value="observed" data-en="Synced">已同步</option>
              <option value="ignored" data-en="Ignored">已忽略</option>
              <option value="rejected" data-en="Rejected">已驳回</option>
              <option value="done" data-en="Completed">已完成</option>
              <option value="failed" data-en="Failed">失败</option>
              <option value="running" data-en="Running">运行中</option>
              <option value="waiting-reply" data-en="Waiting for reply">等待回复</option>
              <option value="waiting-followup" data-en="Waiting for follow-up">等待后续</option>
              <option value="completion-unconfirmed" data-en="Completion unconfirmed">结束待确认</option>
              <option value="unknown" data-en="Unknown">未记录</option>
            </select>
            <svg aria-hidden="true"><use href="#i-down"></use></svg>
          </label>
        </div>
      </div>
      <div id="active-filter" class="active-filter" hidden></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col" data-en="Time">时间</th><th scope="col" id="record-column" data-en="Event">事件</th><th scope="col" data-en="Source">来源</th><th scope="col">Bot</th><th scope="col" data-en="Result">结果</th><th scope="col" class="number" data-en="Duration">用时</th><th scope="col" class="number" data-en="Tokens">Token</th><th scope="col" class="number" data-en="Cost">费用</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="table-foot"><span id="page-summary"></span><div class="pager"><button class="icon-button previous" id="previous" aria-label="上一页" data-en-aria-label="Previous page" type="button"><svg aria-hidden="true"><use href="#i-chevron"></use></svg></button><button class="icon-button" id="next" aria-label="下一页" data-en-aria-label="Next page" type="button"><svg aria-hidden="true"><use href="#i-chevron"></use></svg></button></div></div>
    </section>
    <footer><span>Grok Radar</span><span id="privacy-note" data-en="Data is processed in this browser">数据仅在当前浏览器中处理</span></footer>
  </main>

  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-heading">
    <div class="dialog-heading"><div><h2 id="detail-heading">事件详情</h2><p id="detail-time"></p></div><button class="icon-button dialog-close" type="button" aria-label="关闭详情" data-en-aria-label="Close event details" autofocus><svg aria-hidden="true"><use href="#i-close"></use></svg></button></div>
    <div id="detail-content" role="region" aria-label="事件详情内容" data-en-aria-label="Event details" tabindex="0"></div>
  </dialog>

  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-heading">
    <div class="dialog-heading"><div><h2 id="import-heading" data-en="Import records">数据来源</h2><p id="active-dataset"></p></div><button class="icon-button dialog-close" type="button" aria-label="关闭数据来源" data-en-aria-label="Close import dialog"><svg aria-hidden="true"><use href="#i-close"></use></svg></button></div>
    <div class="import-content">
      <p data-en="Import Grok or Cursor usage CSV, workflow event JSON, or Cursor Enterprise telemetry in OTLP JSON. Data is stored locally.">支持 Grok 或 Cursor 用量 CSV、工作流事件 JSON，以及 Cursor 企业版遥测的 OTLP JSON。数据保存在当前浏览器。</p>
      <label class="file-picker">
        <svg aria-hidden="true"><use href="#i-upload"></use></svg><span><span data-en="Choose a CSV or JSON file">选择 CSV 或 JSON 文件</span><small data-en="Up to 10 MB. A successful import replaces the previous one.">最大 10 MB。成功导入后替换上一次导入。</small></span>
        <input id="file-input" type="file" accept=".csv,.json,text/csv,application/json">
      </label>
      <p id="import-status" role="status" hidden></p>
    </div>
  </dialog>
  <noscript>请启用 JavaScript 以使用工作台。</noscript>
</body>
</html>
